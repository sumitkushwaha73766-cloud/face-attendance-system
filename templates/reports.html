{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block page_title %}<i class="bi bi-file-earmark-bar-graph me-2"></i> Export Reports{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Start Date</label>
                        <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">End Date</label>
                        <input type="date" name="end_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Class (Optional)</label>
                        <select name="class_id" class="form-select">
                            <option value="">All Classes</option>
                            {% for cls in classes %}
                                <option value="{{ cls.id }}">{{ cls.class_name }} - {{ cls.section }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Format</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="format" value="excel" id="fmtExcel" checked>
                                <label class="form-check-label" for="fmtExcel">
                                    <i class="bi bi-file-earmark-excel text-success me-1"></i> Excel (.xlsx)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="format" value="pdf" id="fmtPdf">
                                <label class="form-check-label" for="fmtPdf">
                                    <i class="bi bi-file-earmark-pdf text-danger me-1"></i> PDF
                                </label>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-download me-2"></i> Download Report
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
